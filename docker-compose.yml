services:
  db:
    image: postgres:17-alpine
    container_name: hotel-db
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5434:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hotel-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: hotel

volumes:
  hotel_pgdata:
