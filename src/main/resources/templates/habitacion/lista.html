<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Habitaciones</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<div class="container">
    <th:block th:replace="~{fragments/layout :: alerts(${mensaje}, ${error}, ${errorGlobal})}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-bed me-2"></i>Gestion de Habitaciones</h2>
        <a class="btn btn-primary" th:href="@{/habitaciones/nuevo}"><i class="bi bi-plus-lg"></i> Nueva Habitacion</a>
    </div>

    <form th:action="@{/habitaciones}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select class="form-select" name="tipo" th:value="${tipoFiltro}">
                <option value="">Todos</option>
                <option value="SENCILLA" th:selected="${tipoFiltro} == 'SENCILLA'">Sencilla</option>
                <option value="SUITE" th:selected="${tipoFiltro} == 'SUITE'">Suite</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select class="form-select" name="estado" th:value="${estadoFiltro}">
                <option value="">Todos</option>
                <option value="DISPONIBLE" th:selected="${estadoFiltro} == 'DISPONIBLE'">Disponible</option>
                <option value="RESERVADA" th:selected="${estadoFiltro} == 'RESERVADA'">Reservada</option>
                <option value="OCUPADA" th:selected="${estadoFiltro} == 'OCUPADA'">Ocupada</option>
                <option value="MANTENIMIENTO" th:selected="${estadoFiltro} == 'MANTENIMIENTO'">Mantenimiento</option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <a class="btn btn-outline-secondary w-100" th:href="@{/habitaciones}">Limpiar</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>Numero</th>
                        <th>Tipo</th>
                        <th>Capacidad</th>
                        <th>Tarifa/noche</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${habitaciones}">
                        <td th:text="${h.numero}">-</td>
                        <td th:text="${h.tipo}">-</td>
                        <td th:text="${h.capacidad}">-</td>
                        <td th:text="${#numbers.formatDecimal(h.tarifaNoche, 0, 'COMMA', 2, 'POINT')}">-</td>
<td>
    <th:block th:switch="${h.estado}">
        <span class="badge bg-success" th:case="'DISPONIBLE'" th:text="${h.estado}">-</span>
        <span class="badge bg-warning text-dark" th:case="'RESERVADA'" th:text="${h.estado}">-</span>
        <span class="badge bg-success" th:case="'OCUPADA'" th:text="${h.estado}">-</span>
        <span class="badge bg-secondary" th:case="'MANTENIMIENTO'" th:text="${h.estado}">-</span>
        <span class="badge bg-secondary" th:case="*" th:text="${h.estado}">-</span>
    </th:block>
</td>
                        <td class="text-end">
                            <a th:href="@{/habitaciones/editar/{id}(id=${h.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/habitaciones/eliminar/{id}(id=${h.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Está seguro de eliminar esta habitación? Si tiene reservas no se permitirá.');">
                                <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
