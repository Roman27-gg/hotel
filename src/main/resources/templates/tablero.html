<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Tablero</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<div class="container">
    <th:block th:replace="~{fragments/layout :: alerts(${mensaje}, ${error}, ${errorGlobal})}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-speedometer2 me-2"></i>Tablero - Resumen del Hotel</h2>
        <a class="btn btn-primary" th:href="@{/habitaciones/nuevo}"><i class="bi bi-plus-lg"></i> Nueva Habitacion</a>
    </div>

    <div class="row g-3">
        <div class="col-md-2">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">Disponibles</h5>
                    <p class="card-text display-4" th:text="${disponibles}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5 class="card-title">Reservadas</h5>
                    <p class="card-text display-4" th:text="${reservadas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5 class="card-title">Ocupadas</h5>
                    <p class="card-text display-4" th:text="${ocupadas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <h5 class="card-title">Mantenimiento</h5>
                    <p class="card-text display-4" th:text="${mantenimiento}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card bg-info text-dark">
                <div class="card-body">
                    <h5 class="card-title">Entran hoy</h5>
                    <p class="card-text display-4" th:text="${entranHoy}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="card bg-secondary text-white">
                <div class="card-body">
                    <h5 class="card-title">Salen hoy</h5>
                    <p class="card-text display-4" th:text="${salenHoy}">0</p>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
