<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Disponibilidad</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<div class="container">
    <th:block th:replace="~{fragments/layout :: alerts(${mensaje}, ${error}, ${errorGlobal})}"></th:block>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2><i class="bi bi-search me-2"></i>Consulta de Disponibilidad</h2>
            <form th:action="@{/disponibilidad}" method="get" class="card p-4 mb-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Fecha Entrada <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" name="fechaEntrada"
                               th:value="${request != null and request.fechaEntrada != null ? #temporals.format(request.fechaEntrada, 'yyyy-MM-dd') : ''}" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Fecha Salida <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" name="fechaSalida"
                               th:value="${request != null and request.fechaSalida != null ? #temporals.format(request.fechaSalida, 'yyyy-MM-dd') : ''}" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo">
                            <option value="">Todos</option>
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                                    th:selected="${request != null and request.tipo == t}">Tipo</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Personas</label>
                        <input type="number" class="form-control" name="personas"
                               th:value="${request != null and request.personas != null ? request.personas : ''}" min="1" max="6"/>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Buscar</button>
                    </div>
                </div>
            </form>

            <div th:if="${mensaje != null}" class="alert alert-info" th:text="${mensaje}"></div>

            <div th:if="${disponibles != null and !disponibles.isEmpty()}">
                <h5>Habitaciones disponibles</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Numero</th>
                            <th>Tipo</th>
                            <th>Capacidad</th>
                            <th>Tarifa/noche</th>
                            <th>Valor estimado</th>
                            <th class="text-end">Accion</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="h : ${disponibles}">
                            <td th:text="${h.numero}">-</td>
                            <td th:text="${h.tipo}">-</td>
                            <td th:text="${h.capacidad}">-</td>
                            <td th:text="${#numbers.formatDecimal(h.tarifaNoche, 0, 'COMMA', 2, 'POINT')}">-</td>
                            <td th:text="${#numbers.formatDecimal(h.valorTotalEstimado, 0, 'COMMA', 2, 'POINT')}">-</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/reservas/nuevo(habitacionId=${h.id}, fechaEntrada=${request.fechaEntrada}, fechaSalida=${request.fechaSalida})}">Reservar esta</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:if="${disponibles != null and disponibles.isEmpty()}" class="text-muted">
                No hay habitaciones disponibles para las fechas seleccionadas.
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
