<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Reservas</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<div class="container">
    <th:block th:replace="~{fragments/layout :: alerts(${mensaje}, ${error}, ${errorGlobal})}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-calendar-check me-2"></i>Gestion de Reservas</h2>
        <a class="btn btn-primary" th:href="@{/reservas/nuevo}"><i class="bi bi-plus-lg"></i> Nueva Reserva</a>
    </div>

    <form th:action="@{/reservas}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select class="form-select" name="estado" th:value="${estadoFiltro}">
                <option value="">Todos</option>
                <option value="CONFIRMADA" th:selected="${estadoFiltro} == 'CONFIRMADA'">Confirmada</option>
                <option value="CANCELADA" th:selected="${estadoFiltro} == 'CANCELADA'">Cancelada</option>
                <option value="FINALIZADA" th:selected="${estadoFiltro} == 'FINALIZADA'">Finalizada</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Documento huesped</label>
            <input type="text" class="form-control" name="documento" th:value="${documentoFiltro}" placeholder="Documento"/>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <a class="btn btn-outline-secondary w-100" th:href="@{/reservas}">Limpiar</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>Habitacion</th>
                        <th>Huesped</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Noches</th>
                        <th>Estado</th>
                        <th>Valor Total</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reservas}">
                        <td th:text="${r.habitacionNumero}">-</td>
                        <td th:text="${r.huespedNombreCompleto}">-</td>
                        <td th:text="${r.fechaEntrada}">-</td>
                        <td th:text="${r.fechaSalida}">-</td>
                        <td th:text="${r.noches}">-</td>
<td>
    <th:block th:switch="${r.estado}">
        <span class="badge bg-primary" th:case="'CONFIRMADA'" th:text="${r.estado}">-</span>
        <span class="badge bg-danger" th:case="'CANCELADA'" th:text="${r.estado}">-</span>
        <span class="badge bg-success" th:case="'FINALIZADA'" th:text="${r.estado}">-</span>
        <span class="badge bg-secondary" th:case="*" th:text="${r.estado}">-</span>
    </th:block>
</td>
                        <td th:text="${#numbers.formatDecimal(r.valorTotal, 0, 'COMMA', 2, 'POINT')}">-</td>
                        <td class="text-end">
                            <a th:href="@{/reservas/{id}(id=${r.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/reservas/editar/{id}(id=${r.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${r.estado} == 'CONFIRMADA'" th:action="@{/reservas/checkin/{id}(id=${r.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Realizar check-in?');">
                                <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-box-arrow-in-right"></i></button>
                            </form>
                            <form th:if="${r.estado} == 'CONFIRMADA'" th:action="@{/reservas/checkout/{id}(id=${r.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Realizar check-out?');">
                                <button type="submit" class="btn btn-sm btn-warning"><i class="bi bi-box-arrow-right"></i></button>
                            </form>
                            <form th:if="${r.estado} == 'CONFIRMADA'" th:action="@{/reservas/cancelar/{id}(id=${r.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Cancelar reserva? Se aplicara penalizacion.');">
                                <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-x-circle"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
